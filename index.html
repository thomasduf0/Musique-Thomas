<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Journal d'écoute</title>
  <meta name="description" content="Récap de mes écoutes d'albums : notes et coups de cœur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="assets/theme.js?v=1"></script>
  <script src="assets/auth.js?v=20261108b"></script>
  <link rel="stylesheet" href="assets/style.css?v=20261110b">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12100e">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <nav class="switch" aria-label="Section du site">
        <a href="index.html" aria-current="page">Albums</a>
        <a href="concerts.html">Concerts</a>
      </nav>
      <div class="hero-top">
        <h1>Journal d'écoute</h1>
        <div class="hero-actions">
          <div class="search" role="search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Rechercher un album ou un artiste…" autocomplete="off" aria-label="Rechercher un album" aria-controls="sresults">
            <div id="sresults" class="sresults" hidden></div>
          </div>
          <button class="random-btn" id="random-btn" type="button"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Écoute aléatoire</span></button>
          <a class="icon-btn priv" href="reglages.html" title="Réglages" aria-label="Réglages"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
      <dl class="kpis" id="kpis"></dl>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist">
    <button role="tab" data-view="all" aria-selected="true">Écoutés</button>
    <button role="tab" data-view="fav" aria-selected="false">Coups de cœur</button>
    <button class="priv" role="tab" data-view="todo" aria-selected="false">À écouter</button>
    <button class="priv" role="tab" data-view="reco" aria-selected="false">Conseillés pour Thomas</button>
    <button role="tab" data-view="stats" aria-selected="false">Statistiques</button>
  </nav>

  <main class="wrap">
    <section id="filters" class="filters">
      <select id="genre" aria-label="Genre"><option value="">Tous les genres</option></select>
      <select id="lang" aria-label="Langue"><option value="">Toutes les langues</option></select>
      <select id="rating" aria-label="Note">
        <option value="">Toutes les notes</option>
        <option value="5">★★★★★</option><option value="4">★★★★</option>
        <option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
      </select>
      <select id="sort" aria-label="Tri">
        <option value="listened">Écoutés récemment</option>
        <option value="listened-asc">Écoutés il y a longtemps</option>
        <option value="rating">Meilleures notes</option>
        <option value="released">Date de sortie</option>
        <option value="artist">Artiste A→Z</option>
      </select>
    </section>

    <p id="count" class="count"></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="artist" class="artist-view" hidden></section>
    <section id="reco" class="reco" hidden></section>
    <section id="stats" class="stats" hidden></section>
  </main>

  <dialog id="detail" class="detail">
    <button class="close" aria-label="Fermer" onclick="this.closest('dialog').close()">×</button>
    <div id="detail-body"></div>
  </dialog>

  <dialog id="story" class="detail story">
    <button class="close" aria-label="Fermer" onclick="this.closest('dialog').close()">×</button>
    <div id="story-body"></div>
  </dialog>

  <footer class="wrap foot">
    <p>Données issues de mon Notion · <span id="updated"></span></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/config.js?v=20261108b"></script>
  <script src="assets/app.js?v=20261108b"></script>
</body>
</html>
