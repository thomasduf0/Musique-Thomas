<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Journal d'écoute</title>
  <meta name="description" content="Récap de mes écoutes d'albums : notes, coups de cœur et albums à écouter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=20261106d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
</head>
<body class="locked">
  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-box">
      <span class="gate-logo" aria-hidden="true">💿</span>
      <h1>Journal d'écoute</h1>
      <p>Site privé : entre le mot de passe pour y accéder.</p>
      <input id="gate-pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required aria-label="Mot de passe">
      <button class="btn">Entrer</button>
      <p id="gate-err" class="gate-err" role="alert"></p>
    </form>
  </div>

  <header class="hero">
    <div class="wrap">
      <div class="hero-top">
        <h1>Journal d'écoute</h1>
        <a class="btn listen-btn" href="ajouter.html">🎧 J'ai écouté</a>
      </div>
      <dl class="kpis" id="kpis"></dl>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist">
    <button role="tab" data-view="all" aria-selected="true">Écoutés</button>
    <button role="tab" data-view="fav" aria-selected="false">Coups de cœur</button>
    <button role="tab" data-view="todo" aria-selected="false">À écouter</button>
    <button role="tab" data-view="reco" aria-selected="false">Conseillés pour Thomas</button>
    <button role="tab" data-view="stats" aria-selected="false">Stats</button>
  </nav>

  <main class="wrap">
    <section id="filters" class="filters">
      <input id="q" type="search" placeholder="Rechercher un album ou un artiste…" aria-label="Rechercher">
      <select id="genre" aria-label="Genre"><option value="">Tous les genres</option></select>
      <select id="lang" aria-label="Langue"><option value="">Toutes les langues</option></select>
      <select id="rating" aria-label="Note">
        <option value="">Toutes les notes</option>
        <option value="5">★★★★★</option><option value="4">★★★★</option>
        <option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
      </select>
      <select id="sort" aria-label="Tri">
        <option value="listened">Écoutés récemment</option>
        <option value="listened-asc">Écoutés il y a longtemps</option>
        <option value="rating">Meilleures notes</option>
        <option value="released">Date de sortie</option>
        <option value="artist">Artiste A→Z</option>
      </select>
    </section>

    <p id="count" class="count"></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="artist" class="artist-view" hidden></section>
    <section id="reco" class="reco" hidden></section>
    <section id="stats" class="stats" hidden></section>
  </main>

  <dialog id="detail" class="detail">
    <button class="close" aria-label="Fermer" onclick="this.closest('dialog').close()">×</button>
    <div id="detail-body"></div>
  </dialog>

  <footer class="wrap foot">
    <p>Données issues de mon Notion · <span id="updated"></span> · Hébergé sur github.io</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/config.js?v=20261106d"></script>
  <script src="assets/app.js?v=20261106d"></script>
</body>
</html>
