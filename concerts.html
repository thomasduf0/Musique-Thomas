<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Concerts · Journal d'écoute</title>
  <meta name="description" content="Récap de mes concerts et festivals : carte, statistiques, artistes vus en live.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="assets/theme.js?v=1"></script>
  <link rel="stylesheet" href="assets/style.css?v=20261107e">
  <link rel="stylesheet" href="assets/concerts.css?v=20261107e">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12100e">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
</head>
<body class="locked">
  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-box">
      <span class="gate-logo" aria-hidden="true">🎤</span>
      <h1>Concerts</h1>
      <p>Site privé : entre le mot de passe pour y accéder.</p>
      <input id="gate-pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required aria-label="Mot de passe">
      <button class="btn">Entrer</button>
      <p id="gate-err" class="gate-err" role="alert"></p>
    </form>
  </div>

  <header class="hero">
    <div class="wrap">
      <nav class="switch" aria-label="Section du site">
        <a href="index.html">Albums</a>
        <a href="concerts.html" aria-current="page">Concerts</a>
      </nav>
      <div class="hero-top">
        <h1>Concerts</h1>
        <div class="hero-actions">
          <div class="search" role="search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="Rechercher un artiste, une salle, une ville…" autocomplete="off" aria-label="Rechercher un concert">
          </div>
          <a class="icon-btn" href="reglages.html" title="Réglages" aria-label="Réglages"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
      <dl class="kpis" id="kpis"></dl>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">Tous les concerts</button>
    <button role="tab" data-view="map" aria-selected="false">Carte</button>
    <button role="tab" data-view="stats" aria-selected="false">Statistiques</button>
    <button role="tab" data-view="wish" aria-selected="false">Wantlist <span class="tab-n" id="wish-n"></span></button>
    <button role="tab" data-view="todo" aria-selected="false">Artistes non complétés <span class="tab-n" id="todo-n"></span></button>
  </nav>

  <main class="wrap">
    <section id="filters" class="filters c-filters">
      <select id="f-year" aria-label="Année"><option value="">Toutes les années</option></select>
      <select id="f-type" aria-label="Type">
        <option value="">Concerts et festivals</option>
        <option value="Concert">Concerts</option>
        <option value="Festival">Festivals</option>
      </select>
      <select id="f-city" aria-label="Ville"><option value="">Toutes les villes</option></select>
      <select id="f-sort" aria-label="Tri">
        <option value="desc">Plus récents d'abord</option>
        <option value="asc">Plus anciens d'abord</option>
      </select>
    </section>
    <p id="count" class="count"></p>
    <section id="list" class="c-list" aria-live="polite"></section>
    <section id="map-view" class="c-map-view" hidden>
      <div id="map" class="c-map" role="region" aria-label="Carte des salles de concert"></div>
      <div id="venues" class="c-venues"></div>
    </section>
    <section id="stats" class="stats" hidden></section>
    <section id="wish" class="c-wish" hidden></section>
    <section id="todo" class="c-todo" hidden></section>
  </main>

  <dialog id="detail" class="detail c-detail">
    <button class="close" aria-label="Fermer" onclick="this.closest('dialog').close()">×</button>
    <div id="detail-body"></div>
  </dialog>
  <datalist id="dl-venues"></datalist>
  <datalist id="dl-cities"></datalist>
  <datalist id="dl-artists"></datalist>

  <footer class="wrap foot">
    <p>Données issues de mon Notion (page Concerts) · <span id="updated"></span></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/config.js?v=20261106f"></script>
  <script src="assets/concerts.js?v=20261107e"></script>
</body>
</html>
