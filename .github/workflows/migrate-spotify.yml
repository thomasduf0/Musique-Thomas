name: Liens Spotify (migration)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = proposer les correspondances, apply = les appliquer dans Notion"
        required: true
        default: preview
        type: choice
        options: [preview, apply]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migration (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/migrate-spotify.mjs
      - name: Enregistrer l'aperçu
        if: inputs.mode == 'preview'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spotify-migration.json
          git diff --cached --quiet || (git commit -m "Aperçu de la migration Spotify [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)
