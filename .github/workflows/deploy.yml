name: Synchro Notion et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:
  repository_dispatch:
    types: [notion-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données (Notion si le secret existe) et les pochettes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/build-data.mjs

      - name: Enregistrer les données et pochettes si elles ont changé
        run: |
          git add -A data covers
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mise à jour des écoutes depuis Notion [skip ci]"
            git pull --rebase -X theirs origin main || git rebase --abort
            git push origin HEAD:main || echo "::warning::Données non enregistrées dans le dépôt (le site est publié quand même)"
          fi

      - name: Préparer le site
        run: |
          mkdir -p _site covers
          cp -r index.html ajouter.html assets data covers _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
